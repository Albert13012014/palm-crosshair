name: Build Crosshair PyQt5

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka PyQt5 pystray pillow keyboard
    
    - name: Build Windows executable
      run: |
        python -m nuitka --onefile --standalone --assume-yes-for-downloads --enable-plugin=pyqt5 --windows-console-mode=disable --windows-icon-from-ico="icon.ico" --output-filename="Palm Crosshair.exe" main_qt.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palm-Crosshair-Windows
        path: Palm Crosshair.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka PyQt5 pystray pillow pynput
    
    - name: Convert icon to macOS icns format
      run: |
        python - << 'PY'
        from PIL import Image
        import os
        im = Image.open("icon.ico")
        os.makedirs("icon.iconset", exist_ok=True)
        for s in [16, 32, 64, 128, 256, 512]:
            im.resize((s, s)).save(f"icon.iconset/icon_{s}x{s}.png")
        PY
        iconutil -c icns icon.iconset
    
    - name: Build macOS app
      run: |
        python -m nuitka --mode=app --assume-yes-for-downloads --enable-plugin=pyqt5 --macos-app-icon=icon.icns --output-filename="Palm Crosshair" main_qt.py

    - name: Create app bundle fallback
      run: |
        if [ ! -d "Palm Crosshair.app" ]; then
          mkdir -p "Palm Crosshair.app/Contents/MacOS"
          mkdir -p "Palm Crosshair.app/Contents/Resources"
          cp "Palm Crosshair" "Palm Crosshair.app/Contents/MacOS/"
          cp icon.icns "Palm Crosshair.app/Contents/Resources/" 2>/dev/null || true
          cat > "Palm Crosshair.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Palm Crosshair</string>
              <key>CFBundleName</key>
              <string>Palm Crosshair</string>
              <key>CFBundleIdentifier</key>
              <string>com.palm.crosshair</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
        fi
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palm-Crosshair-macOS
        path: |
          Palm Crosshair.app
