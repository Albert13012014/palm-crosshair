name: Build Crosshair

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka keyboard pywin32 pystray pillow
    
    - name: Build Windows executable
      run: |
        python -m nuitka --onefile --standalone --assume-yes-for-downloads --enable-plugin=tk-inter --windows-console-mode=disable --windows-icon-from-ico="icon.ico" --output-filename="Palm Crosshair.exe" main.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palm-Crosshair-Windows
        path: Palm Crosshair.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka pynput pystray pillow
    
    - name: Build macOS executable
      run: |
        python -m nuitka --onefile --standalone --assume-yes-for-downloads --enable-plugin=tk-inter --output-filename="Palm Crosshair" main.py
    
    - name: Create .app bundle
      run: |
        mkdir -p "Palm Crosshair.app/Contents/MacOS"
        mkdir -p "Palm Crosshair.app/Contents/Resources"
        cp Palm\ Crosshair "Palm Crosshair.app/Contents/MacOS/"
        cat > "Palm Crosshair.app/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Palm Crosshair</string>
            <key>CFBundleName</key>
            <string>Palm Crosshair</string>
            <key>CFBundleIdentifier</key>
            <string>com.palm.crosshair</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
        </dict>
        </plist>
        EOF
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palm-Crosshair-macOS
        path: |
          Palm Crosshair
          Palm Crosshair.app
